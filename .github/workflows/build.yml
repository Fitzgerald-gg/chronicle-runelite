name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Compile and test
        run: ./gradlew build
      - name: Static analysis
        run: ./gradlew spotbugsMain -I config/spotbugs.gradle
